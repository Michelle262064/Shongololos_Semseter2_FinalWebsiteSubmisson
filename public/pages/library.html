<!DOCTYPE html>
<html lang="en">
 <head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>StreamLine Library</title>

     <!--Fonts & Icons-->
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

     <!--Bootstrap & CSS-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="/public/css/main.css">
     <link rel="stylesheet" href="/public/css/library.css">
    </head>

    <body>
     <!--Main Header (same as homepage.html)-->
     <header class="library container-fluid py-2" id="library">
          <nav class="navbar-container d-flex align-items-center justify-content-between flex-wrap gap-3">
             <a href="/public/pages/homepage.html" class="logoLink d-inline-block"><img src="../assets/img/logo.png" class="logo" alt="StreamLine"></a>

             <!--Search Bar-->
             <div class="search">
                 <form action="/public/pages/library.html" method="GET" class="search-form d-flex align-items-center">
                     <input type="search" name="search" id="searchInput" class="search-input form-control" placeholder="Search for Movies..">
                     <button type="submit" class="search-submit btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
              </div>

             <!--Nav links-->
             <div class="nav-menu" id="nav-menu">
                 <ul class="menu-inner d-flex list-unstyled gap-4 mb-0">
                     <li class="menu-item"><a href="/public/pages/homepage.html" class="menu-link text-decoration-none">Home</a></li>
                     <li class="menu-item"><a href="/public/pages/watchlist.html" class="menu-link text-decoration-none">Watch List</a></li>
                     <li class="menu-item"><a href="/public/index.html" class="menu-link text-decoration-none">Login</a></li>
                     <li class="menu-item"><a href="/public/index.html" class="menu-link text-decoration-none">Sign Up</a></li>
                  </ul>
              </div>
          </nav>
      </header>

      <!--Library Content-->
      <main class="library-main">
         <h1 id="libraryTitle">Library</h1>

         <div class="library-filters">
             <!--Category filter pills (same as homepage.html)-->
             <div class="library-categories d-flex flex-wrap gap-2">
                 <button class="category-pill btn btn-sm active" data-genre="">All</button>
                 <button class="category-pill btn btn-sm" data-genre="35">Comedy</button>
                 <button class="category-pill btn btn-sm" data-genre="18">Drama</button>
                 <button class="category-pill btn btn-sm" data-genre="28">Action</button>
                 <button class="category-pill btn btn-sm" data-genre="27">Horror</button>
             </div>

             <!--Minimum rating filter-->
             <form id="filter-form" class="rating-form">
                 <input type="number" id="min-rating" step="0.1" min="0" max="10" placeholder="Min rating">
                 <button type="submit" class="filter-btn">Filter</button>
                 <button type="button" id="show-all" class="filter-btn filter-btn-grey">Show all</button>
             </form>
         </div>

         <!--Movie cards (filled in by library.js)-->
         <div id="libraryGrid" class="library-grid"></div>
      </main>

      <!--Footer (homepage.html has none, this one is copied from the sign-in page)-->
      <footer class="siteFooter">
         <p>&copy; 2026 Streamline Interactive Development Project.</p>
      </footer>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
      <script src="/public/js/config.js"></script>
      <script src="/public/js/script.js"></script>
      <script src="/public/js/library.js"></script>
  </body>
</html>
