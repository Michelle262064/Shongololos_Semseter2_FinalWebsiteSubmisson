<!DOCTYPE html>
<html lang="en">
 <head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>StreamLine Movie</title>
    
     <!--Fonts & Icons-->
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
     
     <!--Bootstrap & CSS-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="/css/main.css">
    </head>

    <body>
     <!--Main Header-->
     <header class="library container-fluid py-2" id="library">
          <nav class="navbar-container d-flex align-items-center justify-content-between flex-wrap gap-3">
             <a href="/pages/homepage.html" class="logoLink d-inline-block"><img src="/assets/img/logo.png" class="logo" alt="StreamLine"></a>

             <!--Search Bar-->
             <div class="search">
                 <form action="/pages/library.html" method="GET" class="search-form d-flex align-items-center">
                     <input type="search" name="search" id="searchInput" class="search-input form-control" placeholder="Search for Movies.." autofocus>
                     <button type="submit" class="search-submit btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
              </div>

             <!--Nav links-->
             <div class="nav-menu" id="nav-menu">
                 <ul class="menu-inner d-flex list-unstyled gap-4 mb-0">
                     <li class="menu-item"><a href="/pages/homepage.html" class="menu-link active text-decoration-none">Home</a></li>
                     <li class="menu-item"><a href="/pages/watchlist.html" class="menu-link text-decoration-none">Watch List</a></li>
                     <li class="menu-item"><a href="/index.html" class="menu-link text-decoration-none">Login</a></li>
                     <li class="menu-item"><a href="/index.html" class="menu-link text-decoration-none">Sign Up</a></li>                  </ul>
              </div>
          </nav>
      </header>

      <!--Hero Banner Slider Section-->
      <section class="hero container-fluid px-0" id="hero">
         <div id="carouselHero" class="carouselHero carousel slide" data-bs-ride="carousel">
             <div class="carouselInner carousel-inner" id="carouselInner">
                 <div class="carouselItem carousel-item active">
                     <div class="hero-overlay-info p-5">
                         <h1 id="title" class="hero-title-text display-4 fw-bold">Loading Featured Title...</h1>
                         <div id="content" class="hero-media-injector"></div>
                     </div>
                  </div>
              </div>
        
              <div class="carousel-dots-indicator carousel-indicators" id="carouselIndicators"></div>
        
              <!--Slider Controls-->
              <button class="carousel-control-prev" type="button" id="prevBtn" data-bs-target="#carouselHero" data-bs-slide="prev" aria-label="Previous Slide">
                 <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              </button>
              <button class="carousel-control-next" type="button" id="nextBtn" data-bs-target="#carouselHero" data-bs-slide="next" aria-label="Next Slide">
                 <span class="carousel-control-next-icon" aria-hidden="true"></span>
              </button>
          </div>
      </section>

      <!--Homepage Content Base Grid-->
      <main class="homePage container-fluid py-4">
         
         <!--Categories Filter Pills Row-->
         <section class="home-row-section mb-4">
             <div class="row-section-header d-flex justify-content-between align-items-center mb-2">
                 <h2 class="h4 mb-0">Categories</h2>
                 <a href="#" class="show-more-btn text-decoration-none small">Show More</a>
              </div>
              <div class="categories-pill-row d-flex flex-wrap gap-2">
                  <button class="category-pill btn btn-sm active" data-genre="">All</button>
                  <button class="category-pill btn btn-sm" data-genre="35">Comedy</button>
                  <button class="category-pill btn btn-sm" data-genre="18">Drama</button>
                  <button class="category-pill btn btn-sm" data-genre="28">Action</button>
                  <button class="category-pill btn btn-sm" data-genre="27">Horror</button>
              </div>

          </section>

          <!--Poster Row: Recently Added Layer-->
          <section class="home-row-section mb-4">
             <div class="row-section-header d-flex justify-content-between align-items-center mb-2">
                 <h2 class="h4 mb-0">Recently Added</h2>
                 <a href="/pages/library.html" class="show-more-btn text-decoration-none small">Show More</a>
              </div>
              <div class="horizontal-scroll-wrapper position-relative">
                 <button class="paddle-nav left-paddle btn">‹</button>
                 <div class="poster-grid-viewport d-flex gap-3 overflow-x-auto pb-2" id="recentlyAddedGrid">
                     <!-- Dynamic content populated via JavaScript script.js -->
                 </div>
                 <button class="paddle-nav right-paddle btn">›</button>
               </div>
          </section>

          <!--Poster Row: Recently Watched/Trending-->
          <section class="feed-section mb-4">
             <div class="feed-header d-flex justify-content-between align-items-center mb-2">
                 <h2 class="h4 mb-0">Recently Watched</h2>
                 <a href="/pages/library.html" class="show-more-link text-decoration-none small">Show More</a>
              </div>
              <div class="horizontal-scroll-wrapper position-relative">
                 <button class="paddle-nav left-paddle btn">‹</button>
                 <div class="poster-grid-viewport d-flex gap-3 overflow-x-auto pb-2" id="recentlyWatchedGrid">
                     <!-- Dynamic content populated via JavaScript script.js -->
                 </div>
                 <button class="paddle-nav right-paddle btn">›</button>
              </div>
          </section>

           <footer class="siteFooter">
             <p>&copy; 2026 Streamline Interactive Development Project.</p>
           </footer>
           
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="/js/config.js"></script>
        <script src="/js/script.js"></script>
  </body>
</html>
