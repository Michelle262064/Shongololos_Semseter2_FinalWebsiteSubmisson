<!DOCTYPE html>
<html lang="en">
 <head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>StreamLine Movie</title>

     <!--Fonts & Icons-->
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

     <!--Bootstrap & CSS-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="/css/media.css">
    </head>

    <body class="mediaPage">
     <!--Full-page backdrop-->
     <div class="mediaBackdrop position-fixed top-0 start-0 w-100 h-100" id="mediaBackdrop"></div>
     <div class="mediaShade position-fixed top-0 start-0 w-100 h-100"></div>

     <div class="mediaWrap position-relative min-vh-100 d-flex flex-column">

         <!--Top bar: logo + close button-->
         <header class="mediaTopBar d-flex align-items-center justify-content-between px-4 py-3">
             <a href="/pages/homepage.html" class="logoLink d-inline-block"><img src="/Assests/Logo_Horizontal.png" class="logo" alt="StreamLine"></a>
             <button type="button" class="mediaClose btn btn-danger rounded-circle" id="closeBtn" aria-label="Close movie"><i class="fa-solid fa-xmark"></i></button>
         </header>

         <!--Movie information (populated by media.js)-->
         <main class="mediaMain container-xl flex-grow-1 pb-4">
             <h1 class="mediaTitle mb-1" id="mediaTitle">Loading Movie...</h1>
             <p class="mediaGenres mb-4" id="mediaGenres"></p>

             <div class="mediaLayout row g-4">
                 <div class="mediaLeft col-12 col-md-4 col-lg-3" id="mediaLeft"></div>
                 <div class="mediaRight col-12 col-md-8 col-lg-9" id="mediaRight"></div>
             </div>
         </main>

         <!--Filmstrip of stills along the bottom-->
         <footer class="mediaFilmstrip py-3" id="mediaFilmstrip" hidden>
             <div class="filmStripInner container-xl d-flex align-items-center gap-2">
                 <button type="button" class="filmArrow filmPrev btn border-0" id="filmPrev" aria-label="Previous images"><i class="fa-solid fa-caret-left"></i></button>
                 <div class="filmThumbs d-flex flex-grow-1 gap-2" id="filmThumbs"></div>
                 <button type="button" class="filmArrow filmNext btn border-0" id="filmNext" aria-label="Next images"><i class="fa-solid fa-caret-right"></i></button>
             </div>
             <p class="filmCounter text-center mb-0 mt-2" id="filmCounter"></p>
         </footer>

     </div>

     <!--Full-size image viewer-->
     <div class="mediaLightbox position-fixed top-0 start-0 w-100 h-100 d-none align-items-center justify-content-center" id="lightbox">
         <button type="button" class="lightboxClose btn btn-danger rounded-circle position-absolute top-0 end-0 m-3" id="lightboxClose" aria-label="Close image"><i class="fa-solid fa-xmark"></i></button>
         <button type="button" class="lightboxNav lightboxPrev btn position-absolute start-0 top-50 translate-middle-y" id="lightboxPrev" aria-label="Previous image"><i class="fa-solid fa-chevron-left"></i></button>
         <img class="lightboxImg img-fluid" id="lightboxImg" alt="">
         <button type="button" class="lightboxNav lightboxNext btn position-absolute end-0 top-50 translate-middle-y" id="lightboxNext" aria-label="Next image"><i class="fa-solid fa-chevron-right"></i></button>
         <p class="lightboxCount position-absolute bottom-0 start-50 translate-middle-x mb-3 text-light" id="lightboxCount"></p>
     </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <script src="/js/config.js"></script>
     <script src="/js/media.js"></script>
 </body>
</html>
