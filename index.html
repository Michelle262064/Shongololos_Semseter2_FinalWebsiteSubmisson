<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamline - Authentication</title>
     <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header class="siteHeader">
        <a href="#" class="logoContainer">
             <a href="/public/pages/homepage.html" class="logoLink d-inline-block"><img src="/public/assets/img/Firefly_remove the background, only the logo and text must be visible. 555451.png" class="logo" alt="StreamLine"></a>
        </a>
    </header>

    <main class="authMain">
        
        <section id="signinSection" class="authCard">
            <h1>Sign In</h1>
            <form id="signinForm">
                <div class="inputGroup">
                    <label for="signinEmail">Email</label>
                    <input type="email" id="signinEmail" name="email" required placeholder="name@example.com">
                </div>
                
                <div class="inputGroup">
                    <label for="signinPassword">Password</label>
                    <input type="password" id="signinPassword" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="authButton">Sign In</button>
            </form>
            
            <div class="authSwitch">
                <p>New to Streamline? <a href="#" id="showSignup">Sign up now</a>.</p>
            </div>
        </section>

        <section id="signupSection" class="authCard hidden">
            <h1>Create Account</h1>
            <form id="signupForm">
                <div class="inputGroup">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" name="fullname" required placeholder="Full Government Name">
                </div>

                <div class="inputGroup">
                    <label for="signupEmail">Email or Student ID</label>
                    <input type="email" id="signupEmail" name="email" required placeholder="name@example.com">
                </div>

                <div class="inputGroup">
                    <label for="signupPassword">Create Password</label>
                    <input type="password" id="signupPassword" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="authButton">Sign Up</button>
            </form>
            
            <div class="authSwitch">
                <p>Already have an account? <a href="#" id="showSignin">Sign in</a>.</p>
            </div>
        </section>

    </main>

    <footer class="siteFooter">
        <p>&copy; 2026 Streamline Interactive Development Project.</p>
    </footer>




    <script src="/public/js/script.js"></script>
</body>
</html>
